<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Banking CBT Mock Test | Wondermayank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #eef5ff 0%, #d9eaff 100%);
            font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, -apple-system, 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* main card container — light blue & white theme */
        .mock-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(0px);
            border-radius: 3rem;
            box-shadow: 0 25px 45px -12px rgba(0, 30, 60, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05);
            padding: 2rem 2rem 2.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(173, 216, 230, 0.5);
        }

        /* header + title */
        .title-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0b3b5f, #1b7e9f);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-block;
            padding-bottom: 0.25rem;
        }

        .badge {
            display: inline-block;
            background: #cfe7ff;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            margin-top: 0.75rem;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6), 0 2px 6px rgba(0,0,0,0.02);
        }

        /* button grid layout — desktop: two in one line */
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: stretch;
            margin: 2rem 0 2rem;
        }

        /* square button cards */
        .test-card {
            flex: 1 1 280px;
            min-width: 240px;
            background: white;
            border-radius: 2rem;
            padding: 2rem 1.2rem;
            text-align: center;
            text-decoration: none;
            transition: all 0.25s ease-in-out;
            box-shadow: 0 12px 24px -12px rgba(0, 79, 109, 0.2);
            border: 1px solid rgba(135, 206, 250, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;  /* ensures square shape */
        }

        /* hover effect */
        .test-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 28px 32px -16px rgba(0, 110, 150, 0.3);
            border-color: #7bc5e8;
            background: #fbfeff;
        }

        /* icon style inside square */
        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 1.2rem;
            background: #e1f3fe;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2rem;
            transition: 0.2s;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0 6px 12px -8px rgba(0,0,0,0.1);
        }

        .test-card:hover .card-icon {
            background: #cbeafe;
            transform: scale(1.02);
        }

        .card-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #115e73;
            margin: 0.5rem 0 0.4rem;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #2c6e8f;
            font-weight: 500;
            margin-top: 0.2rem;
            padding: 0 0.5rem;
        }

        /* separator / divider line */
        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #9ad0f5, #cae9ff, #9ad0f5, transparent);
            width: 70%;
            margin: 1.5rem auto 1.8rem;
            border-radius: 5px;
        }

        /* footer button "Make by Wondermayank" */
        .maker-section {
            text-align: center;
            margin-top: 1rem;
        }

        .maker-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            padding: 0.85rem 2rem;
            border-radius: 60px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            color: #0369a1;
            border: 1px solid #9acde0;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            font-family: inherit;
        }

        .maker-btn:hover {
            background: white;
            border-color: #2c9bcb;
            color: #0b4b6b;
            box-shadow: 0 12px 18px -10px rgba(0, 128, 128, 0.2);
            transform: scale(0.98);
        }

        /* extra note */
        .info-note {
            text-align: center;
            font-size: 0.75rem;
            color: #5c8eaa;
            margin-top: 1.8rem;
            border-top: 1px dashed #bddff5;
            padding-top: 1.2rem;
        }

        /* ========== RESPONSIVE: Mobile/Tablet ========== */
        /* On screens smaller than 768px (tablet & mobile): 1 button per line */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .mock-container {
                padding: 1.5rem 1rem 2rem;
                border-radius: 2rem;
            }
            .button-grid {
                flex-direction: column;
                align-items: center;
                gap: 1.8rem;
            }
            .test-card {
                width: 100%;
                max-width: 320px;
                min-width: auto;
                aspect-ratio: 1 / 1;   /* keep square even on mobile */
                padding: 1.5rem 1rem;
            }
            .card-icon {
                width: 70px;
                height: 70px;
                font-size: 2.8rem;
            }
            .card-title {
                font-size: 1.5rem;
            }
            .main-title {
                font-size: 1.7rem;
            }
        }

        /* For very small devices (<=480px) fine-tune padding */
        @media (max-width: 480px) {
            .test-card {
                max-width: 280px;
                aspect-ratio: 1 / 1;
            }
            .card-icon {
                width: 64px;
                height: 64px;
                font-size: 2.4rem;
            }
            .main-title {
                font-size: 1.5rem;
            }
        }

        /* maintain square shape on all screens */
        .test-card {
            aspect-ratio: 1 / 1;
        }
        /* optional: prevent flex shrink weirdness */
        .button-grid {
            width: 100%;
        }

        /* subtle light blue glow */
        .test-card:active {
            transform: scale(0.97);
            transition: 0.05s;
        }
    </style>
</head>
<body>
<div class="mock-container">
    <div class="title-section">
        <h1 class="main-title">🏦 Banking CBT Mock Test</h1>
        <div class="badge">By Wondermayank • Simulated Exam Interface</div>
    </div>

    <!-- Two square buttons in one line (desktop) / stacked (mobile) -->
    <div class="button-grid">
        <!-- Button 1: Section Wise -->
        <a href="https://commercesehoga.github.io/banking/test1.html" class="test-card" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">📚</div>
            <div class="card-title">Section wise</div>
            <div class="card-desc">Topic-wise • Chapter based</div>
        </a>

        <!-- Button 2: Normal Mock -->
        <a href="https://commercesehoga.github.io/banking/test2.html" class="test-card" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">📋</div>
            <div class="card-title">Normal</div>
            <div class="card-desc">Full length • CBT style</div>
        </a>
    </div>

    <div class="divider"></div>

    <!-- Button Make by Wondermayank (links to wondermayank.github.io) -->
    <div class="maker-section">
        <a href="https://wondermayank.github.io" class="maker-btn" target="_blank" rel="noopener noreferrer">
            ✨ Make by Wondermayank ✨
        </a>
    </div>
    <div class="info-note">
        ⚡ Select any mock test — both open in new tab for seamless practice
    </div>
</div>
</body>
</html>
